name: Java CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql-db:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: felipe
          MYSQL_DATABASE: grupo12
          MYSQL_USER: felipe
          MYSQL_PASSWORD: felipe
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y ejecutar pruebas (JUnit)
        env:
          MYSQL_HOST: 127.0.0.1
        run: mvn clean test